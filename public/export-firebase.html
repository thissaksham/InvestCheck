<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>InvestCheck — Export Firebase Data</title>
  <style>
    body { background: #09090b; color: #f4f4f5; font-family: system-ui, sans-serif; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
    main { max-width: 480px; padding: 2rem; text-align: center; }
    button { background: #2563eb; color: white; border: 0; border-radius: 12px; padding: 14px 28px; font-size: 16px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    p { color: #a1a1aa; line-height: 1.5; }
    #status { margin-top: 1rem; min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>Export legacy Firebase data</h1>
    <p>One-time migration helper. Sign in with the same Google account you used before, and your old portfolio downloads as a JSON file. Import it in the new app via <strong>Settings → Import legacy data</strong>.</p>
    <button id="export">Sign in with Google &amp; Export</button>
    <p id="status"></p>
  </main>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

    // Old Firebase project (web config, public by design)
    const firebaseConfig = {
      projectId: "gen-lang-client-0357699503",
      appId: "1:470157919541:web:48482a7e6889814b2af87c",
      apiKey: "AIzaSyAtzB5uYVgS0DoWEbckfQk4iljN4o5y1I0",
      authDomain: "gen-lang-client-0357699503.firebaseapp.com",
    };
    const firestoreDatabaseId = "ai-studio-11ec064d-0a45-4991-b5a3-d09731d23132";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app, firestoreDatabaseId);
    const auth = getAuth(app);
    const status = document.getElementById("status");
    const btn = document.getElementById("export");

    btn.addEventListener("click", async () => {
      btn.disabled = true;
      try {
        status.textContent = "Signing in…";
        const { user } = await signInWithPopup(auth, new GoogleAuthProvider());

        status.textContent = "Reading portfolio…";
        const read = async (name) => {
          const snap = await getDocs(query(collection(db, name), where("uid", "==", user.uid)));
          return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        };
        const settingsSnap = await getDoc(doc(db, "user_settings", user.uid));
        const payload = {
          exportedAt: new Date().toISOString(),
          mutual_funds: await read("mutual_funds"),
          stocks: await read("stocks"),
          fixed_deposits: await read("fixed_deposits"),
          user_settings: settingsSnap.exists() ? settingsSnap.data() : {},
        };

        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "investcheck-firebase-export.json";
        a.click();
        status.textContent = `Done: ${payload.mutual_funds.length} MFs, ${payload.stocks.length} stocks, ${payload.fixed_deposits.length} FDs exported.`;
      } catch (err) {
        console.error(err);
        status.textContent = `Failed: ${err.message}`;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
